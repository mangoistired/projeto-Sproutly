<!DOCTYPE html>

<html lang="pt-br">
    <head>
        <title>Sproutly - Broto da Programação</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- pra mobile -->
        <style>
            :root {
                --verde-escuro: #43a047;
                --verde-claro: #81c784;
                --fundo: #f4f7f5;
                --texto: #2d3748;
                --branco: #ffffff;
            }

            
            body {font-family: Arial, Helvetica, sans-serif; padding: 20px; background: #f0f0f0;}
            textarea {width: 100%; height: 150px; font-family: monospace; font-size: 16px;}
            button {margin-top: 10px; padding: 10px 20px; font-size: 16px; cursor: pointer;}
            #retorno {margin-top: 20px; padding: 10px; background:#fff; border: 1px solid #ccc; min-height: 50px; font-family: monospace;}
        </style>
    </head>

    <body>
        <h2>Editor Python</h2>
        <p>Digite seu código abaixo:</p>
        <textarea id="editor" placeholder="print('Olá, Mundo!')"></textarea>
        <button id="b-rodar">Executar</button>

        <h3>Saída:</h3>
        <div id="retorno">A saída do seu código aparecerá aqui!</div>

        <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>

        <script src="script.js"></script>
    </body>
</html>
